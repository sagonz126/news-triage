name: Fetch and label headlines

on:
  schedule:
    - cron: "17 5,11,17,23 * * *"   # four times a day, UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch headlines
        run: python -m triage.fetch_news
      - name: Label headlines
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite   # pinned: changing it starts a new experiment
        run: python -m triage.label
      # Scoring also runs here: GitHub often starts scheduled jobs hours late,
      # so the evening score job alone left the page without outcomes.
      - name: Prices and score
        if: always()
        continue-on-error: true
        run: |
          python -m triage.prices
          python -m triage.score
      - name: Update website data
        if: always()
        run: python -m triage.site
      - name: Commit
        if: always()
        run: |
          git config user.name "news-triage bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data results
          git diff --cached --quiet || git commit -m "Headlines and labels $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
