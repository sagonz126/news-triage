name: Fetch and label headlines

on:
  schedule:
    - cron: "17 5,11,17,23 * * *"   # four times a day, UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch headlines
        run: python -m triage.fetch_news
      - name: Label headlines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python -m triage.label
      - name: Commit
        run: |
          git config user.name "news-triage bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Headlines and labels $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
