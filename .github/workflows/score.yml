name: Update prices and score

on:
  schedule:
    - cron: "43 21 * * 1-5"   # after every European close, UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m triage.prices
      - run: python -m triage.score
      - name: Commit
        run: |
          git config user.name "news-triage bot"
          git config user.email "actions@users.noreply.github.com"
          git add data results
          git diff --cached --quiet || git commit -m "Prices and score $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
